flow`,summary:`llm-d 把网关、EPP、InferencePool 和模型服务器拆成可组合的 Kubernetes 原语。`,nodes:[`Gateway API`,`InferencePool / EPP`,`模型服务器`,`KV / Connector`],details:[`请求先进入 Gateway API，由 Inference Extension 扩展点交给 EPP；项目已进入 CNCF Sandbox。`,`EPP 先 filter 再 score：前缀、队列、SLO headroom 与延迟预测共同决定目标。`,`vLLM 优先，也提供 SGLang 镜像线；P/D 可由独立 worker 承担。`,`精确前缀索引依赖 tokenizer 与 ZMQ KVEvents，KV 经 Connector 在 P/D 间搬运。`]},"13.03":{kind:`compare`,summary:`AIBrix 把 Kubernetes 控制面和 OpenAI 兼容数据面分开，Motor 也遵循类似分工。`,nodes:[],labels:[`控制面`,`数据面`,`Motor 对照`],variants:[[`ModelClaim / ModelWarmup`,`StormService`,`自动扩缩`],[`OpenAI 兼容网关`,`前缀 / 负载 / P-D 路由`,`引擎实时状态`],[`Controller`,`Coordinator`,`NodeManager`]],details:[`控制面负责模型声明、预热、部署与扩缩，属于慢路径。`,`数据面负责每个请求的鉴权、路由、转发与观测，属于热路径。`,`Motor 的 Controller 管实例状态，Coordinator 管请求编排，NodeManager 管本地进程。`]},"13.04":{kind:`flow`,summary:`Dynamo 把请求路径与 KV 事件路径分开：frontend 路由，worker 通过 ZMQ 报告 KV，NIXL 搬运。`,nodes:[`Frontend`,`KV-aware Router`,`Prefill Worker`,`Decode Worker`],details:[`Frontend 处理 OpenAI 协议、鉴权和请求生命周期。`,`KVPublisher 上报事件，KvIndexer 维护全局前缀树，Router 用成本函数选 worker。`,`Prefill worker 建立 KV，经 NIXL 或 Mooncake 传给 Decode。`,`Decode worker 复用 KV 逐 token 生成；active decode blocks 也计入下一次选点。`]},"13.05":{kind:`matrix`,summary:`四个项目分别把路由、参考部署、组合式服务、模型托管做深；Mooncake 则是被消费的 KV 数据面。`,nodes:[],details:[],matrix:{columns:[`关键词`,`核心机制`,`最适合的场景`],rows:[{label:`SGLang Router`,cells:[`轻量路由`,`bucket + cache-aware / power-of-two`,`SGLang 多实例入口`]},{label:`vLLM Production Stack`,cells:[`参考部署`,`vLLM + 可观测 + 扩缩`,`快速搭 vLLM 服务`]},{label:`Ray Serve LLM`,cells:[`组合式服务`,`Ingress + Request Router`,`Python 编排与多模型`]},{label:`Triton`,cells:[`模型托管`,`repository + backend + ensemble`,`多框架 / 传统模型`]},{label:`Mooncake`,cells:[`KV 数据面`,`Transfer Engine + Store`,`被路由层消费，不是竞品`]}]}},"13.06":{kind:`matrix`,summary:`选型不是比 star，而是比接口、故障边界、硬件与团队能力。`,nodes:[],details:[],matrix:{columns:[`定位`,`路由 / PD / KV`,`成熟度信号`,`主要代价`],rows:[{label:`MindIE Motor`,cells:[`昇腾多实例编排`,`统一入口 / P-D / KV 索引`,`2026-03 开源；3 个月 3 版`,`默认绑昇腾；RAS 是差异`],accent:!0},{label:`llm-d`,cells:[`K8s 原生路由栈`,`EPP / P-D / KV 感知`,`CNCF Sandbox；v0.10`,`依赖 K8s 与控制器`]},{label:`AIBrix`,cells:[`K8s 控制面 + 网关`,`10 种策略 / P-D / 会话`,`v0.8；vLLM 社区项目`,`组件多，运维面大`]},{label:`NVIDIA Dynamo`,cells:[`GPU 推理数据面`,`KV-aware / NIXL / P-D`,`v1.8；NVIDIA 主导`,`强依赖 NVIDIA 软件栈`]},{label:`SGLang Router`,cells:[`轻量入口`,`cache-aware / power-of-two`,`随 SGLang 发布`,`路由器与引擎同仓`]},{label:`Production Stack`,cells:[`vLLM 参考部署`,`以 vLLM 能力为主`,`chart 0.1.14；2.7k stars`,`不是完整控制面`]}]}}});var f={"引擎、模型、Motor，各是什么":{why:`下载的权重不会自己监听端口，Ascend 上跑推理必须先由引擎加载权重并组织调度；实例多起来之后又需要一个统一入口来做选点与生命周期管理，三层职责因此分开。`,without:`把模型目录当成可访问服务，部署后没有任何进程监听端口，客户端 connection refused；换引擎后仍沿用旧引擎的模板与精度假设，输出被静默截断却仍返回 200。`,signal:`日志里看不到引擎进程启动行，/health 无响应，或引擎启动即报 vocab size 与 tokenizer 不匹配。`,tradeoff:`讲清三层要额外维护模型、引擎、驱动、芯片四者的版本矩阵；只跑单卡单实例时直接调引擎更轻，Motor 的收益要到多实例才显现。`,evidence:`docs/zh/architecture.md；motor/node_manager/core/services/native_engine/factory.py`},一条请求在引擎内部经历什么:{why:`文字先过 tokenizer 变成 token ID，Prefill 一次处理整段输入并建立 KV，Decode 每步只算一个新位置并复用历史 KV；不拆开这三步，就解释不了首 token 与后续 token 的成本差异。`,without:`把字符数直接当 token 预算会低估输入，长请求在引擎侧被截断或返回 400；忽略 Prefill 与 Decode 的阶段差，会把排队时间误判成模型变慢，优化方向整体跑偏。`,signal:`客户端首 token 时间远大于 TPOT，或响应 usage.prompt_tokens 与请求字符数之比明显偏离该 tokenizer 的常规比例。`,tradeoff:`这套自回归叙事不覆盖 embedding、多模态 encoder 与非自回归模型；这类负载的数据流要重新画，不能套用 KV 复用的结论。`,evidence:`docs/zh/architecture.md；course-facts.md 引擎章节`},"vLLM 与 SGLang 内部怎样分工":{why:`两个引擎都有名为 Scheduler 的组件，但 Motor 的 Scheduler 选的是实例，引擎的 Scheduler 选的是本轮 batch；同名不同层，是排障中最高发的概念混淆点。`,without:`混用两层调度会把实例级热点当成引擎 bug，反复调 max_num_seqs 却看不到效果；分页块管理和前缀 Radix 树也会被当成同一套缓存，命中率口径对不上。`,signal:`调大 batch 参数后集群 P99 不降反升，或同一请求在不同实例上的 prefix cache 命中率差异巨大。`,tradeoff:`讲内部结构必须绑定版本，vLLM V1 与 SGLang Python 服务路径都可能变；应记职责不记类名和进程数，否则升级后全部失效。`,evidence:`vllm.ai 2025-09-05 anatomy 博客；sglang/srt/managers/scheduler.py`},"Motor 的整体架构与两条主线":{why:`Motor 同时承载请求流、实例状态流和缓存索引流，三者的速率与一致性要求完全不同；分开画线，才不会误以为 Controller 在逐条代理推理请求。`,without:`把 Controller 当请求代理，它一重启数据面就整体中断；把索引命中当成真实缓存可取回，跨实例取回失败时系统静默降级，用户只看到变慢。`,signal:`Controller 重启期间所有请求失败，或 Coordinator 选中已被摘除的 endpoint 并持续重试同一地址。`,tradeoff:`三线分离带来更多组件与部署形态；独立部署 Coordinator 时可省掉管理链，但实例需要自己通过管理接口登记，运维成本转移到使用方。`,evidence:`docs/zh/architecture.md；docs/zh/user_guide/deployment/standalone.md`},"Coordinator 内部模块为什么存在":{why:`入口、路由、协议适配和请求记账的变化频率不同；一个函数包办会让新增引擎字段改到所有调用方，重试也无法独立释放资源，因此按边界拆开。`,without:`缺少 attempt 级记账时，重试会重复占用调度负载，客户端断开后槽位不回收，队列最终被幽灵请求填满，新请求只能排队超时。`,signal:`并发上不去而 NPU 利用率偏低，分配计数只增不减，ZMQ 管理消息或共享账本出现版本冲突告警。`,tradeoff:`多进程加 Rust 共享内存降低了管理往返，但引入视图过期与跨进程一致性成本；小规模部署用单进程更容易调试和定位。`,evidence:`motor/coordinator/router/dispatch_session.py；motor/coordinator/daemon/`},"vLLM 与 SGLang 能否同时接入":{why:`同时支持在部署、入口、P/D 三个层面含义不同，客户常拿一个层面的能力去承诺另一个；Motor 按 engine_type 分支适配，但类型匹配只是必要条件。`,without:`强行把 vLLM Prefill 配 SGLang Decode，会在 handoff 或 bootstrap 分支被拒绝，P 阶段完成却无 D 接收，KV 悬空，连接一直等到超时。`,signal:`UnifiedPDRouter 日志出现 required_engine_type 不匹配，或 P 侧 KV 已生成而 D 侧从未收到交接请求。`,tradeoff:`隔离服务组最稳，代价是上游要自建路由和容量规划；混合池收益更大，但必须端到端验证，不能靠实例记录里有 engine_type 就推断可用。`,evidence:`motor/coordinator/router/strategies/unified_pd.py；tests/coordinator/router/test_unified_pd_router.py`},"Controller 怎样维护实例":{why:`一个推理实例可能跨多个端点和节点，节点活着、进程活着、引擎能回答是三个不同事实；Controller 要把这些报告折叠成可调度状态并推给入口。`,without:`只按 PID 判活，NPU OOM 后进程仍在但生成全部失败，入口继续派单，直到大量请求超时实例才被摘除，故障窗口被拉长。`,signal:`实例长期显示 READY 但成功率骤降；EventPusher 推送的 ADD 时间与 NodeManager 心跳对不上，入口视图滞后。`,tradeoff:`notify 同步遍历观察者且不逐观察者捕获异常，任一订阅者阻塞会拖慢整个状态转移；异步化能解耦，但要补事件乱序与丢失的处理。`,evidence:`motor/controller/core/instance_manager.py；motor/controller/core/observer.py`},"NodeManager 怎样管理本地引擎":{why:`引擎进程必须按节点实际情况拉起，配置到命令的转换要和真正的 exec 分离，否则没有 NPU 的机器连启动规格都无法验证，只能到远端试错。`,without:`配置直接拼 shell 执行，参数错误只在远端进程崩溃时暴露；心跳只报 PID，探测不到接口正常但生成失败的静默故障，坏实例持续接流量。`,signal:`Supervisor 反复重启同一进程，restart 计数飙升；/health 返回 200 但探测请求持续 5xx 或返回空输出。`,tradeoff:`生成式探测能发现静默故障，但每次探测都占用推理资源，周期太密会与业务抢 batch；需要按负载和引擎类型分别设定。`,evidence:`motor/node_manager/core/services/native_engine/supervisor.py；backends/base.py`},"缓存索引、存储与调度收益":{why:`相同前缀可以复用 KV，但复用成立依赖模型、分词、位置和后端身份的严格一致；索引把这些覆盖关系集中起来，供 Coordinator 在选点前评分。`,without:`只按文本相似度路由，KV 身份不匹配时取回失败或数据被错误解释，Prefill 白做一遍，命中率看着很高而 TTFT 完全不降。`,signal:`索引返回 matched_tokens 很高但引擎 prefill 时间没有减少，或取回阶段出现 backend 超时与 block hash 冲突。`,tradeoff:`缓存亲和与负载天然冲突，过度追命中会把请求堆到热实例；w_disk 默认 0 也说明磁盘层取回并非总是划算，需要按介质加权。`,evidence:`docs/zh/design/kv_conductor.md；scheduler_config.kv_affinity.w_npu/w_cpu/w_disk`},仓库目录与设计模式怎样对应:{why:`目录按职责切分是为了让变化落在局部；策略、适配器、观察者不是装饰，而是对规则会换、协议会多、状态要通知这三个事实的直接回应。`,without:`绕过既有接口另存一份实例状态，会出现两份权威视图，扩容或摘除后路由仍按旧表选点，新实例长期收不到流量而旧实例被打满。`,signal:`同名状态在多个模块各自维护，重启后计数与 Controller 不一致；新模块没有被 attach，事件从不触发，指标恒为零。`,tradeoff:`过早抽象会让一个小改动跨多个文件；模式应在第二个变化出现时引入，而不是照着目录名硬套，否则增加阅读成本。`,evidence:`motor/coordinator/scheduler/policy/factory.py；motor/common/app/application.py`},怎样定位等待与测容量:{why:`首 token 慢和出字慢对应完全不同的阶段，客户端观测还叠加网络与排队；不分段就只能猜，压测时也容易把并发数当成到达率。`,without:`把客户端 TTFT 全算到引擎，会去调 Prefill 参数而忽略上游排队；用并发数代替 QPS 测容量，得到的峰值换台机器就复现不了。`,signal:`服务端各段 span 之和远小于客户端耗时，或成功率在高并发下先掉、队列长度单调上升而吞吐不再增长。`,tradeoff:`分段观测需要 trace 与时钟对齐，接入成本不低；本机 135M 模型与 MLX 只能验证方法和协议，不能外推 NPU 集群容量。`,evidence:`motor-validation-performance skill；course-facts.md 第 11 章边界`},"练习：参考现有架构新增模块":{why:`新模块真正难的不是类本身，而是被创建、登记、订阅、停止这四步；事件计数练习刻意把这几个接线点暴露出来，避免只交一个孤立的类。`,without:`只写类不 attach，对象构造成功却永不收到事件；有后台线程却没有停止路径，角色切换后旧节点继续计数，指标出现双份。`,signal:`日志有模块初始化行但没有 update 记录；进程退出时线程未 join，或备角色仍在写事件计数。`,tradeoff:`内存计数器最简单，但不跨重启也不去重；要唯一实例数或持久账本就必须引入身份、窗口与存储，复杂度和验证成本陡增。`,evidence:`motor/controller/controller.py 的 init_modules 与 _OBSERVER_NAMES`},与主流开源推理栈对比:{why:`把 Motor 放进 vLLM production stack、SGLang router、Ray Serve、KServe 的坐标系里，才能看出它把复杂度投在集群编排、PD 交接与实例生命周期，而非单实例推理优化。`,without:`只按单机 benchmark 选型，会低估跨实例 PD 交接与故障编排的工程量，上线后才发现缺少实例隔离、缓存索引和统一入口视图。`,signal:`单实例吞吐与上游方案接近，但多实例扩容后成功率与 P99 差距拉大，故障恢复时间以分钟计。`,tradeoff:`Motor 绑定 Ascend 与 vLLM/SGLang 原生引擎，换硬件或换引擎都要重验；纯 GPU 小集群直接用上游 router 往往更轻。`,evidence:`docs/zh/architecture.md；course-facts.md 混合引擎三结论`}},p={"01.03":{why:`单实例时客户端直连引擎最省事；实例变多后，选点、摘除和生命周期不该由每个客户端各自承担，Motor 因此把组织权收到入口层。`,without:`没有 Motor 时客户端要自带实例列表与重试逻辑，扩容后各客户端视图不一致，流量仍压在已下线的旧地址上。`,signal:`客户端连接池出现大量 connection refused，而新实例的 QPS 长期为零，只有探针在访问。`},"02.02":{why:`Prefill 一次处理整段输入并建立 KV，Decode 每步只算一个新位置；混为一谈就无法解释首 token 与后续 token 的成本差。`,without:`若 Decode 每步都重算整段上下文，生成长度 500 的回答会做约 500 次近似全量前向，延迟随长度近似平方增长。`,signal:`TPOT 随输出长度持续恶化，NPU 利用率很高但 token/s 很低，长回答请求尤其明显。`},"02.03":{why:`请求交给某实例不等于立刻开始计算，引擎仍要在等待队列里按 token 预算组批；外层选点与内层排队是两级不同的延迟来源。`,without:`把实例选择当成执行开始，会把引擎排队时间误记为网络或模型耗时，扩容方向也会选错，越扩越慢。`,signal:`服务端 span 显示请求已到达实例，但首 token 前有长时间等待，waiting 队列持续增长而 running 已满。`},"03.03":{why:`Motor 的 Scheduler 决定请求去哪个实例，引擎的 Scheduler 决定本轮 batch 放哪些序列；同名不同层，是排障中最常见的误判来源。`,without:`混用两层会拿实例负载去解释引擎 OOM，或反之以 max_num_seqs 解释集群热点，调参方向整体偏离真实瓶颈。`,signal:`调整引擎 batch 参数后集群 P99 不变，而按实例维度看流量分布严重倾斜，个别实例长期空转。`},"03.04":{why:`上下文逻辑连续，但物理缓存块不必相邻；分页把序列位置映射到块表，避免为每条长请求预留整段连续显存。`,without:`按连续显存分配时，长请求会把空闲显存切成碎片，新请求总显存明明够却分配失败，只能排队或拒绝。`,signal:`日志出现 block 分配失败而 npu-smi 显示仍有空闲显存，cache usage 曲线呈明显锯齿并逐渐走低。`},"03.05":{why:`生成过程中请求不断结束与加入，固定批次会留下空槽；每轮重组批让新请求填补空位，设备利用率才不会被最长请求拖住。`,without:`固定 batch 要等整批最慢请求结束才换血，短请求完成后槽位空转到超时，waiting 队列随之持续堆积。`,signal:`批次平均长度远低于配置上限，running 数周期性跌到 1，waiting 队列长度单调上升。`},"03.06":{why:`长输入的一次性 Prefill 会长时间占住设备，挤压正在 Decode 的请求；分块把输入工作切成小段插入调度轮次，让两类工作共存。`,without:`不做分块时，一条 32K 输入会让同实例上所有 Decode 请求停顿数百毫秒，TPOT 出现与长请求到达同步的尖刺。`,signal:`TPOT P99 随长输入请求到达规律抖动，Decode 批次出现空窗，长输入请求完成前 token/s 曲线掉底。`},"03.08":{why:`多轮对话与共享 system prompt 让前缀大量重复，Radix 树按 token 前缀组织可复用块，命中时直接跳过对应 Prefill。`,without:`没有前缀复用，每条请求都整段重算 Prefill，共享长 system prompt 的场景 TTFT 与算力成倍浪费。`,signal:`相同前缀请求的 prefill token 数不下降，radix cache hit rate 接近零，而输入长度分布高度集中。`},"04.01":{why:`请求从 Coordinator 进入被选中的引擎，PD 分离时 KV 由引擎 Connector 交接；把搬运画到 Controller 上会误判职责与故障域。`,without:`让 Coordinator 代理 KV 数据，控制面会变成数据面瓶颈，PD 交接延迟与入口负载互相放大，两边一起劣化。`,signal:`Coordinator 网络带宽打满而 NPU 利用率下降，PD 交接耗时与入口 QPS 呈明显正相关。`},"04.03":{why:`索引让 Coordinator 在选点前知道哪里有前缀覆盖，但索引只是覆盖记录，真实 KV 仍由引擎或存储后端持有。`,without:`把索引命中当作缓存可取回，选中实例后取回失败，Prefill 必须重做，路由收益归零甚至比不路由更慢。`,signal:`查询返回 npu_blocks 很高但引擎侧 prefix cache miss，或取回阶段出现 backend 超时与重试。`},"05.02":{why:`一个用户请求可能重试多次，每次尝试有独立资源、任务和释放标记；根请求身份把它们串起来，才能分别核对成败与清理。`,without:`没有 attempt 级记账时，重试会重复占用调度负载，客户端断开后旧尝试不被清理，槽位被幽灵请求占满。`,signal:`分配计数只增不减而引擎侧无对应请求，并发上不去，NPU 利用率偏低。`},"05.03":{why:`管理、观测与推理的节奏差异很大，拆进程可避免慢日志或观测阻塞调度；分配释放热路径用 Rust 共享内存原子操作，省掉管理进程往返。`,without:`全部放一个进程时，一次慢 GC 或阻塞日志会卡住整个调度循环；共享内存缺失则每次分配都要 RPC，热路径延迟明显上升。`,signal:`调度循环出现周期性停顿，或分配延迟曲线与 ZMQ 管理消息量同步波动。`},"06.01":{why:`两套服务并存、同一入口混合池、跨引擎 P/D 是三件不同的事，兼容性要求逐级升高，不能用一句支持全部回答。`,without:`把服务组并存的能力当成跨引擎 P/D 可用，配好拓扑后请求卡在 P 完成、D 无人接收，连接一直等到超时。`,signal:`日志出现 required_engine_type 不匹配，P 侧 bootstrap 成功但 D 侧从未收到交接请求。`},"06.03":{why:`统一 PD 路由在选择 Decode 时会带上 required_engine_type 并做匹配检查，类型一致只是必要检查之一，不是可用性承诺。`,without:`忽略类型检查强行配对，KV 布局与协议字段不兼容，取回数据被错误解释，表现为乱码、空输出或解码崩溃。`,signal:`请求在 P 阶段一切正常，进入 D 后立即 5xx，或输出 token 分布明显异常、重复率高。`},"07.02":{why:`状态变化要驱动入口视图、故障决策与运维上报，观察者让这些反应彼此独立，InstanceManager 不必直接依赖每个下游模块。`,without:`notify 同步遍历且不逐观察者捕获异常，任一订阅者抛异常会中断后续通知，入口保留过期实例继续接流量。`,signal:`某次状态变更后 EventPusher 有记录而 FaultManager 无动作，入口视图与 Controller 状态长期不一致。`},"07.03":{why:`主备决定哪些模块何时启动、停止和重建状态；恢复动作必须幂等，否则切换后同一故障会被两份逻辑重复处理。`,without:`备角色仍在执行恢复逻辑，主备同时重启同一批实例，进程刚拉起就被对端再次杀掉，恢复迟迟不收敛。`,signal:`两套 Controller 日志同时出现恢复动作，实例重启次数远高于实际故障次数。`},"08.01":{why:`NodeManager 从 Controller 取实例身份与启动信息，再把配置转换成命令和探测规格；转换与执行分离，无 NPU 环境也能验证规格。`,without:`配置直接拼 shell 执行，参数错误只能在远端进程崩溃时发现，启动失败原因埋在引擎日志里，排查链路很长。`,signal:`Supervisor 反复重启，实际命令行参数与预期配置不一致，或进程启动即退出且没有业务日志。`},"08.02":{why:`心跳负责传达状态事实，健康探测取得节点侧证据；进程存活不等于模型能生成，接口返回 200 也可能是空壳。`,without:`只按 PID 判活，NPU OOM 后进程仍在但生成全部失败，入口继续派单，直到请求大面积超时才摘除实例。`,signal:`/health 持续 200 而业务请求错误率上升，心跳时间线与探测结果互相矛盾。`},"09.03":{why:`缓存最多的实例往往也最忙，调度要同时权衡复用收益、排队与取回成本，单一命中率不是优化目标。`,without:`只按命中率选点会把流量堆到热实例，队列变长吃掉了前缀复用省下的时间，整体 TTFT 反而上升。`,signal:`命中实例的 prefill 时间下降但端到端延迟上升，该实例队列长度与 QPS 同步走高。`},"11.01":{why:`首 token 等待与出字速度落在不同阶段，客户端观测还叠加网络与排队；不分段就只能靠猜，优化很容易打偏。`,without:`把客户端 TTFT 全算到引擎，会去调 Prefill 参数而忽略上游排队，问题在别的负载下依旧复现。`,signal:`服务端各段 span 之和远小于客户端耗时，同一请求在客户端与服务端的时间线无法对齐。`},"11.02":{why:`并发数与到达率不是一回事，峰值吞吐也不等于业务容量；固定模型与缓存状态后逐步加 03.03`,title:`两层调度怎样区别`},{id:`03.04`,title:`vLLM：KV 为什么按块管理`},{id:`03.05`,title:`vLLM：每一轮重新组批`},{id:`03.06`,title:`vLLM：长输入怎样影响输出`},{id:`03.07`,title:`vLLM：执行器和并行 worker`},{id:`03.08`,title:`SGLang：前缀树记住什么`},{id:`03.09`,title:`SGLang：输入管理不只是分词`},{id:`03.10`,title:`SGLang：调度循环每轮做什么`},{id:`03.11`,title:`SGLang：输出为什么单独处理`},{id:`03.12`,title:`怎样公平理解两种引擎`}];function re({step:e,chapter:t,chapterTitle:n,playing:r}){let i=ne[e];return(0,h.jsx)(S,{id:i.id,title:i.title,chapter:t,chapterTitle:n,playing:r},i.id)}var ie=[`以 vLLM V1 的常见路径为例，输入处理把请求交给引擎核心。调度器选择本轮工作，模型执行器组织 worker 做前向计算，输出处理再把结果交回服务层。进程数量和具体类名会随版本、并行方式变化。`,`SGLang 的一种常见 Python 服务路径中，TokenizerManager 准备请求，Scheduler 安排批次并驱动模型执行，DetokenizerManager 把输出 ID 转成文字。新的服务后端可能改变进程布局，理解职责比背固定进程数更可靠。`,`Motor 调度关注请求交给哪个实例或端点。引擎调度关注实例内部这一轮执行哪些序列、怎样分配缓存与批处理预算。它们都会影响延迟，但解决的问题不同。缓存优化也应区分单实例内复用与跨实例路由。`,`vLLM 的分页式缓存把序列位置映射到缓存块。逻辑上连续的上下文，不要求所有物理块相邻。块管理降低内存组织的限制，但不让显存变成无限容量。这里用编号块解释映射，不画真实地址。`,`连续批处理会在生成过程中重新安排活跃请求。请求结束后，运行槽位可以被新工作使用。批大小、token预算和缓存容量都会约束调度，不是把并发开得越大就一定越快。`,`长输入的 Prefill 可能影响其他请求的生成节奏。分块 Prefill 将输入工作分段安排，让输入和已有输出工作更灵活地共存。具体收益取决于负载与配置，不等于任何场景都能降低延迟。`,`Scheduler 产生本轮工作，Executor 组织 worker 执行。张量并行把一次模型计算拆给多个设备，数据并行用不同副本承接请求。增加设备也会引入通信和同步成本，不能直接按卡数推算吞吐。`,`Radix Cache 用前缀结构组织可复用的历史计算。两条请求有相同前缀时，可以在满足缓存身份约束的情况下复用公共部分。树记录的是前缀关系，不是根据语义相似度搜索答案。`,`TokenizerManager 还参与请求状态管理、提交工作与返回结果的组织。聊天模板、取消和服务配置也会影响输入路径。新的多 tokenizer 或其他服务后端会改变布局，因此这里讲职责，不承诺固定进程数。`,`Scheduler 接收请求，维护等待和运行工作，结合缓存与预算选择下一批，再驱动模型执行。新请求不应被理解成独占整个设备。缓存不足、执行失败或取消，都可能改变下一轮工作。`,`模型产生 token ID，Detokenizer 把它们转换成文字。流式输出需要处理不完整字符与增量结果，不能假设每个 ID 都恰好是一个汉字。HTTP 收到一个 chunk，也不意味着模型刚生成了一个 token。`,`两种引擎都有调度、缓存与服务能力，不能用“一个只管吞吐、一个只管缓存”概括。比较时要固定模型、精度、硬件、输入输出、缓存状态与版本。先验证合同，再测目标负载下的取舍。`],ae=[{id:`04.01`,title:`用户请求走哪条线`},{id:`04.02`,title:`实例状态走哪条线`},{id:`04.03`,title:`缓存索引是另一条信息线`}];function O({step:e,chapter:t,chapterTitle:n,playing:r}){let i=ae[e];return(0,h.jsx)(S,{id:i.id,title:i.title,chapter:t,chapterTitle:n,playing:r},i.id)}var oe=[`请求从 Coordinator 进入，再到被选中的原生引擎。PD 分离时会由引擎 Co
